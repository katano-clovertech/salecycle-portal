name: SaleCycle Daily Collect

on:
  schedule:
    - cron: '0 7 * * *'   # 毎日 07:00 UTC = 16:00 JST
  workflow_dispatch:        # 手動実行ボタン（テスト用）
    inputs:
      backfill_weekly:
        description: '週次レポートを全期間バックフィル (yes と入力)'
        required: false
        default: ''

permissions:
  contents: write           # CSV commit/push に必要

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright openpyxl pandas requests gspread google-auth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run SaleCycle data collector
        env:
          SALECYCLE_USER: ${{ secrets.SALECYCLE_USER }}
          SALECYCLE_PASS: ${{ secrets.SALECYCLE_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HEADLESS: "1"
        run: |
          if [ "${{ github.event.inputs.backfill_weekly }}" = "yes" ]; then
            python salecycle_data_collector.py --backfill-weekly
          else
            python salecycle_data_collector.py
          fi

      - name: Commit and push updated CSV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add salecycle_daily_report.csv
          git diff --cached --quiet && echo "No changes to commit" || (
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push
          )

      - name: Upload daily backup (kept 3 days)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: salecycle_daily_report.csv
          retention-days: 3
