name: SaleCycle Daily Collect

on:
  schedule:
    - cron: '0 6 * * *'   # 毎日 06:00 UTC = 15:00 JST
  workflow_dispatch:        # 手動実行ボタン（テスト用）
    inputs:
      backfill_weekly:
        description: '週次レポートを全期間バックフィル (yes と入力)'
        required: false
        default: ''
      backfill_missing_client:
        description: '欠損日を再収集するクライアント名（例: Radishbo-ya）'
        required: false
        default: ''
      backfill_weekly_client:
        description: '指定クライアントの週次シートのみバックフィル（例: Radishbo-ya）'
        required: false
        default: ''
      backfill_missing_revenue:
        description: '金額欠損日を再収集（クライアント名を入力 or 空欄で全クライアント）'
        required: false
        default: ''
      from_date:
        description: '全クライアントの欠損日を一括再収集（例: 2026-01-01）'
        required: false
        default: ''

permissions:
  contents: write           # CSV commit/push に必要

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install playwright openpyxl pandas requests gspread google-auth

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run SaleCycle data collector
        env:
          SALECYCLE_USER: ${{ secrets.SALECYCLE_USER }}
          SALECYCLE_PASS: ${{ secrets.SALECYCLE_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HEADLESS: "1"
        run: |
          if [ "${{ github.event.inputs.backfill_weekly }}" = "yes" ]; then
            python salecycle_data_collector.py --backfill-weekly
          elif [ -n "${{ github.event.inputs.backfill_missing_client }}" ]; then
            python salecycle_data_collector.py --backfill-missing-client "${{ github.event.inputs.backfill_missing_client }}"
          elif [ -n "${{ github.event.inputs.backfill_weekly_client }}" ]; then
            python salecycle_data_collector.py --backfill-weekly-client "${{ github.event.inputs.backfill_weekly_client }}"
          elif [ "${{ github.event.inputs.backfill_missing_revenue }}" = "all" ]; then
            python salecycle_data_collector.py --backfill-missing-revenue
          elif [ -n "${{ github.event.inputs.backfill_missing_revenue }}" ]; then
            python salecycle_data_collector.py --backfill-missing-revenue "${{ github.event.inputs.backfill_missing_revenue }}"
          elif [ -n "${{ github.event.inputs.from_date }}" ]; then
            python salecycle_data_collector.py --from-date "${{ github.event.inputs.from_date }}"
          else
            python salecycle_data_collector.py
          fi

      - name: Commit and push updated CSV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          # 生成済みCSVを退避
          cp salecycle_daily_report.csv /tmp/report_generated.csv
          # リモートの最新状態を取得してリセット（コンフリクト回避）
          git fetch origin main
          git reset --hard origin/main
          # 退避CSVとリモートCSVをPythonでマージ（日付正規化＋重複排除）
          python3 - <<'PYEOF'
          import pandas as pd, sys
          remote = pd.read_csv("salecycle_daily_report.csv", encoding="utf-8-sig")
          generated = pd.read_csv("/tmp/report_generated.csv", encoding="utf-8-sig")
          combined = pd.concat([remote, generated], ignore_index=True)
          combined["日付"] = pd.to_datetime(combined["日付"], format="mixed").dt.strftime("%Y-%m-%d")
          combined = combined.drop_duplicates(subset=["日付", "クライアント", "ダッシュボード種別"], keep="last")
          combined = combined.sort_values(["日付", "クライアント", "ダッシュボード種別"]).reset_index(drop=True)
          combined.to_csv("salecycle_daily_report.csv", index=False, encoding="utf-8-sig")
          print(f"Merged: {len(remote)} remote + {len(generated)} generated -> {len(combined)} total rows")
          PYEOF
          git add salecycle_daily_report.csv
          git diff --cached --quiet && echo "No changes to commit" || (
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push
          )

      - name: Upload daily backup (kept 3 days)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: salecycle_daily_report.csv
          retention-days: 3
